name: Database environment
on:
  pull_request:
    paths:
      - infra/db/**
      - .github/workflows/database.yml
  push:
    branches: [main]
    paths:
      - infra/db/**
      - .github/workflows/database.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: true
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate ephemeral credentials
        run: python infra/db/db.py init
      - name: Start three databases and verify permissions and pgvector
        run: python infra/db/db.py up
      - name: Recreate container and verify persisted initialization
        run: |
          python infra/db/db.py down
          python infra/db/db.py up
      - name: Cleanup ephemeral CI database
        if: always()
        run: docker compose --env-file infra/db/.env -f infra/db/compose.yaml down -v
