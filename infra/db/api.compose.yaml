services:
  maintenance:
    build: ../../services/api
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      CATALOG_PASSWORD: ${CATALOG_APP_PASSWORD:?missing runtime credential}
      MEMBER_PASSWORD: ${MEMBER_APP_PASSWORD:?missing member runtime credential}
      SUPPORT_PASSWORD: ${SUPPORT_APP_PASSWORD:?missing support runtime credential}
      ANALYSIS_IMAGE_DIR: /var/lib/kkulpick/analysis
    volumes:
      - analysis_images:/var/lib/kkulpick/analysis
    command: ["python", "-m", "kkulpick.maintenance", "--loop", "--apply"]
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
  migrate:
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "2"}
    build: ../../services/api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      CATALOG_PASSWORD: ${CATALOG_OWNER_PASSWORD:?missing owner credential}
      MEMBER_PASSWORD: ${MEMBER_OWNER_PASSWORD:?missing member owner credential}
      SUPPORT_PASSWORD: ${SUPPORT_OWNER_PASSWORD:?missing support owner credential}
    command: ["python", "migrate.py"]
  api:
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "2"}
    build: ../../services/api
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      CATALOG_PASSWORD: ${CATALOG_APP_PASSWORD:?missing runtime credential}
      MEMBER_PASSWORD: ${MEMBER_APP_PASSWORD:?missing member runtime credential}
      SUPPORT_PASSWORD: ${SUPPORT_APP_PASSWORD:?missing support runtime credential}
      ANALYSIS_IMAGE_DIR: /var/lib/kkulpick/analysis
      APP_ENV: ${APP_ENV:-development}
      BILLING_MODE: ${BILLING_MODE:-disabled}
      BILLING_TEST_TOKEN: ${BILLING_TEST_TOKEN:-}
      ANALYSIS_WORKER_TOKEN: ${ANALYSIS_WORKER_TOKEN:-}
      AFFILIATE_URL_HOSTS: ${AFFILIATE_URL_HOSTS:-store.example.test}
      MOCK_PAYMENT_OUTCOME: ${MOCK_PAYMENT_OUTCOME:-succeeded}
      CATALOG_PRICE_RATIO: ${CATALOG_PRICE_RATIO:-10}
      CATALOG_CURRENCIES: ${CATALOG_CURRENCIES:-KRW,USD,AUD,EUR,INR,GBP,JPY,CNY}
      COLLECTOR_TOKEN: ${COLLECTOR_TOKEN:?run python services/api/dev.py init}
      CATALOG_URL_HOSTS: ${CATALOG_URL_HOSTS:-store.example.test}
      DEV_ORIGINS: ${DEV_ORIGINS:-http://localhost:3000}
      # 앞단 프록시(nginx) 주소. 이 주소가 보낸 X-Forwarded-For만 사용자 주소로 믿는다(#17).
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      GUEST_ANALYSES_PER_MINUTE: ${GUEST_ANALYSES_PER_MINUTE:-6}
    volumes:
      - analysis_images:/var/lib/kkulpick/analysis
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3).read()"]
      interval: 4s
      timeout: 5s
      retries: 30

volumes:
  analysis_images:
