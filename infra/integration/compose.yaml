# Added to workspace --scope integrated. Relative paths: infra/db/compose.yaml.
services:
  vision-redis:
    image: redis:7.4.7-alpine
    # 대기열은 잠깐 쓰는 작업 목록이라 디스크에 남기지 않는다. AOF를 켜 두면 사용자 화면 캡처(base64)가
    # 분석이 끝난 뒤에도 appendonly 파일에 계속 남았다(개인정보·디스크 쓰기). 재시작 시 진행 중 작업만 다시 요청된다.
    command: [redis-server, --appendonly, "no", --save, "", --maxmemory, 256mb, --maxmemory-policy, noeviction]
    volumes: [vision_queue:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 30s
      start_period: 60s
      start_interval: 2s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  vision-api:
    image: kkulpick-vision-integrated:local
    build:
      context: ../../kkulpick_vision
      dockerfile: ../infra/nas/vision/Dockerfile
    environment: {REDIS_HOST: vision-redis, VISION_SERVICE_TOKEN: "${WORKSPACE_TOKEN:?run workspace init}"}
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, "8100"]
    ports: ["127.0.0.1:8100:8100"]
    depends_on:
      vision-redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/openapi.json',timeout=3).read()"]
      # 시작할 때만 2초마다, 그 뒤에는 30초마다 확인(5초마다 파이썬을 새로 띄워 CPU를 15%씩 쓰던 것을 줄임)
      interval: 30s
      start_period: 150s
      start_interval: 2s
      timeout: 4s
      retries: 5
    restart: unless-stopped
  vision-ocr-worker:
    image: kkulpick-vision-integrated:local
    build:
      context: ../../kkulpick_vision
      dockerfile: ../infra/nas/vision/Dockerfile
    environment: {REDIS_HOST: vision-redis, VISION_SERVICE_TOKEN: "${WORKSPACE_TOKEN:?run workspace init}"}
    command: [celery, -A, app.celery_app.celery_app, worker, --loglevel=WARNING, --concurrency=1]
    mem_limit: ${VISION_WORKER_MEM_LIMIT:-3g}  # OCR 입력 모양 고정 후 평소 1GiB 안팎(#66)
    volumes: [vision_models:/home/app/.paddleocr]
    depends_on:
      vision-redis: {condition: service_healthy}
    restart: unless-stopped
  analysis-worker:
    build:
      context: ../..
      dockerfile: services/dev_runtime/Dockerfile
    command: [python, -m, services.dev_runtime.analysis_worker]
    environment:
      API_INTERNAL_URL: http://api:8000
      VISION_INTERNAL_URL: http://vision-api:8100
      RECOMMENDATION_INTERNAL_URL: http://recommendation:8000
      ANALYSIS_WORKER_TOKEN: ${ANALYSIS_WORKER_TOKEN:?run workspace init}
      WORKSPACE_TOKEN: ${WORKSPACE_TOKEN:?run workspace init}
    depends_on:
      api: {condition: service_healthy}
      recommendation: {condition: service_healthy}
      vision-api: {condition: service_healthy}
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
  # 실제 Vision·추천·분석 작업자가 있으므로 workspace의 연결 확인용 어댑터는 integrated에서 꺼도 된다.
  # 기본은 켜짐(CI의 check --scope integrated가 사용). infra/workspace/.env에 WORKSPACE_DEV_ADAPTERS=off면
  # tools/workspace.py가 dev-adapters 프로필을 켜지 않아 아래 8개가 뜨지 않는다(메모리 절약).
  vision: {profiles: [dev-adapters]}
  collector: {profiles: [dev-adapters]}
  worker: {profiles: [dev-adapters]}
  vision-worker: {profiles: [dev-adapters]}
  recommendation-worker: {profiles: [dev-adapters]}
  collector-worker: {profiles: [dev-adapters]}
  broker: {profiles: [dev-adapters]}
  cache: {profiles: [dev-adapters]}
  homepage-crawler:
    # 박정우 홈페이지 크롤러: integrated로 켜면 같이 돌며 쇼핑몰 상품을 백엔드 수집 API로 계속 보낸다.
    # 수집 도메인 허용 목록은 services/api/.env 의 CATALOG_URL_HOSTS. 특정 사이트만: HOMEPAGE_CRAWLER_ONLY=올리브영,마켓컬리
    # 잠시 멈추기: docker compose ... stop homepage-crawler (README 참고)
    image: kkulpick-homepage-crawler:local
    build:
      context: ../..
      dockerfile: services/collector/homepage_crawler/Dockerfile
    environment:
      COLLECTOR_BACKEND_BASE_URL: http://api:8000
      KKULPICK_BACKEND_TOKEN: ${COLLECTOR_TOKEN:?run workspace init}
      # 기본: 정적 크롤링으로 상품이 실제로 수집된 15곳만 (차단·0개 사이트는 목록에만 남김)
      HOMEPAGE_CRAWLER_ONLY: ${HOMEPAGE_CRAWLER_ONLY:-29CM,마켓컬리,중고나라,크림,다이소몰,YES24,풀무원샵,동원몰,하림몰,코스트코,롯데하이마트,후르츠패밀리,패션플러스,무인양품,LG전자}
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
volumes:
  vision_queue:
  vision_models:
