# Shared by workspace full/integrated and NAS Vision. Paths use infra/db/compose.yaml.
x-embedding-build: &embedding-build
  context: ../..
  dockerfile: services/recommendation/Dockerfile
  args:
    RECO_EMBEDDER: ${RECO_EMBEDDER:-st}
    RECO_MODEL_NAME: ${RECO_MODEL_NAME:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
    RECO_MODEL_REVISION: ${RECO_MODEL_REVISION:-e8f8c211226b894fcb81acc59f3b34ba3efd5f42}
x-embedding-env: &embedding-env
  DB_HOST: postgres
  DB_PORT: "5432"
  CATALOG_PASSWORD: ${CATALOG_APP_PASSWORD:?missing runtime credential}
  RECO_EMBEDDER: ${RECO_EMBEDDER:-st}
  RECO_MODEL_NAME: ${RECO_MODEL_NAME:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
  RECO_MODEL_REVISION: ${RECO_MODEL_REVISION:-e8f8c211226b894fcb81acc59f3b34ba3efd5f42}
  RECO_MODEL_DIMENSIONS: ${RECO_MODEL_DIMENSIONS:-384}
  # PyTorch CPU threads; empty = min(4, cores/2). All cores was 8x slower from thread contention (#67).
  RECO_TORCH_THREADS: ${RECO_TORCH_THREADS:-}

services:
  embedding-init:
    build: *embedding-build
    image: kkulpick-embedding:local
    environment:
      <<: *embedding-env
      CATALOG_PASSWORD: ${CATALOG_OWNER_PASSWORD:?missing owner credential}
    command: [python, -m, services.recommendation.embedding_worker, --bootstrap]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: "no"
  embedding-worker:
    build: *embedding-build
    image: kkulpick-embedding:local
    environment: *embedding-env
    command: [python, -m, services.recommendation.embedding_worker]
    depends_on:
      embedding-init: {condition: service_completed_successfully}
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
  recommendation:
    build: *embedding-build
    image: kkulpick-embedding:local
    environment:
      <<: *embedding-env
      WORKSPACE_TOKEN: ${WORKSPACE_TOKEN:?missing service credential}
      RECO_RANKER: ${RECO_RANKER:-auto}  # auto: ANTHROPIC_API_KEY가 있으면 claude, 없으면 rule
      # LLM 순위(RECO_RANKER=claude 또는 local). 값은 infra/workspace/.env에만 두고 Git에 올리지 않는다.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      RECO_LLM_MODEL: ${RECO_LLM_MODEL:-}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-}
      LOCAL_LLM_API_KEY: ${LOCAL_LLM_API_KEY:-}
      RECO_MIN_SCORE: ${RECO_MIN_SCORE:-}
      RECO_SCORE_MARGIN: ${RECO_SCORE_MARGIN:-}
      # 실시간 폴백이 찾은 상품을 DB에 직접 쓰지 않고 백엔드 수집 API로 보낸다(없으면 폴백 적재만 꺼짐).
      COLLECTOR_BACKEND_BASE_URL: http://api:8000
      KKULPICK_BACKEND_TOKEN: ${COLLECTOR_TOKEN:-}
    command: [uvicorn, services.recommendation.http_service:app, --host, 0.0.0.0, --port, "8000"]
    depends_on:
      embedding-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3).read()"]
      # 시작(모델 적재) 중에는 2초마다, 그 뒤에는 30초마다 확인(매 확인마다 DB 연결·파이썬 실행)
      interval: 30s
      start_interval: 2s
      timeout: 5s
      retries: 5
      start_period: 300s
