server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 3m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;
    location /backend/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        # 사용자별 요청 제한이 프록시 주소 하나로 묶이지 않게 실제 접속 주소를 넘긴다(#17).
        # API는 FORWARDED_ALLOW_IPS에 적은 프록시만 믿는다(그 외 주소가 보낸 값은 무시).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    # 빌드마다 이름이 바뀌는 JS·CSS는 오래 캐시하고, 없으면 index.html 대신 404(예전 HTML이 옛 파일을 찾을 때
    # 'MIME type text/html' 오류로 빈 화면이 되던 문제). HTML은 매번 서버에 확인해 새 빌드가 바로 반영되게 한다.
    # (location에 add_header를 쓰면 server의 add_header가 상속되지 않아 보안 헤더를 다시 적는다)
    location ~ ^/(_expo|assets)/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options SAMEORIGIN always;
    }
}
