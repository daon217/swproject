# All relative paths are resolved against the first file, infra/db/compose.yaml.
# API 코드 폴더를 마운트해 둔다. 코드를 고친 뒤 API만 재시작하면 반영된다(docker restart kkulpick-db-dev-api-1).
# 고칠 때마다 자동 반영하려면 infra/workspace/.env에 WORKSPACE_API_RELOAD=on (파일 감시로 쉬는 동안 CPU·메모리를 더 씀).
# 의존성·마이그레이션 변경은 여전히 up(빌드)이 필요하다.
services:
  api:
    volumes:
      - ../../services/api/kkulpick:/srv/kkulpick:ro
    environment:
      API_RELOAD_ARGS: ${API_RELOAD_ARGS:-}
    command: [sh, -c, "exec uvicorn kkulpick.api:app --host 0.0.0.0 --port 8000 $$API_RELOAD_ARGS"]
