{
  "services": {
    "domeggook": {
      "build": {
        "context": "../../../..",
        "dockerfile": "services/collector/collector_ops/deploy/Dockerfile"
      },
      "image": "kkulpick-collector:${COLLECTOR_RELEASE:-local-review}",
      "init": true,
      "restart": "unless-stopped",
      "read_only": true,
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "tmpfs": [
        "/tmp"
      ],
      "stop_grace_period": "60s",
      "mem_limit": "512m",
      "pids_limit": 128,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "profiles": [
        "domeggook"
      ],
      "environment": {
        "COLLECTOR_CONFIG": "/run/config.json",
        "COLLECTOR_RUN_APPROVED": "${COLLECTOR_RUN_APPROVED:-no}",
        "KKULPICK_STATE_DIR": "/state",
        "KKULPICK_MARKETPLACE_STATE_DIR": "/state",
        "DOMEGGOOK_API_KEY_FILE": "/run/secrets/domeggook_api_key",
        "KKULPICK_BACKEND_TOKEN_FILE": "/run/secrets/kkulpick_backend_token"
      },
      "secrets": [
        "domeggook_api_key",
        "kkulpick_backend_token"
      ],
      "volumes": [
        "${CONFIG_DIR:-/srv/kkulpick/config}/domeggook.json:/run/config.json:ro",
        "${OPS_STATE_DIR:-/srv/kkulpick/state/ops}/domeggook:/state/ops/domeggook",
        "${DOMEGGOOK_STATE_DIR:-/srv/kkulpick/state/domeggook}/domeggook_ops:/state/domeggook_ops",
        "${DOMEGGOOK_STATE_DIR:-/srv/kkulpick/state/domeggook}/domeggook_open:/state/domeggook_open"
      ],
      "command": [
        "python",
        "-m",
        "services.collector.collector_ops",
        "--provider",
        "domeggook",
        "--watch"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-m",
          "services.collector.collector_ops",
          "--provider",
          "domeggook",
          "--health",
          "--state-dir",
          "/state"
        ],
        "interval": "30s",
        "timeout": "10s",
        "start_period": "40s",
        "retries": 3
      }
    },
