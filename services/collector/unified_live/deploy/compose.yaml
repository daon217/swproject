{
  "services": {
    "domeggook": {
      "build": {
        "context": "../../../..",
        "dockerfile": "services/collector/unified_live/deploy/Dockerfile"
      },
      "image": "kkulpick-unified-collector:${COLLECTOR_RELEASE:-local-review}",
      "init": true,
      "restart": "unless-stopped",
      "read_only": true,
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "tmpfs": [
        "/tmp"
      ],
      "stop_grace_period": "60s",
      "mem_limit": "512m",
      "pids_limit": 128,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "profiles": [
        "domeggook"
      ],
      "environment": {
        "COLLECTOR_CONFIG": "/run/config.json",
        "COLLECTOR_RUN_APPROVED": "${COLLECTOR_RUN_APPROVED:-no}",
        "KKULPICK_STATE_DIR": "/state",
        "KKULPICK_MARKETPLACE_STATE_DIR": "/state",
        "DOMEGGOOK_API_KEY_FILE": "/run/secrets/domeggook_api_key",
        "KKULPICK_BACKEND_TOKEN_FILE": "/run/secrets/kkulpick_backend_token",
        "COLLECTOR_DELIVERY_APPROVED": "${COLLECTOR_DELIVERY_APPROVED:-no}",
        "COLLECTOR_BACKEND_TRANSPORT": "${COLLECTOR_BACKEND_TRANSPORT:-https}",
        "COLLECTOR_BACKEND_BASE_URL": "${COLLECTOR_BACKEND_BASE_URL:-}",
        "COLLECTOR_BACKEND_CATALOG_HOSTS": "${COLLECTOR_BACKEND_CATALOG_HOSTS:-}",
        "COLLECTOR_BACKEND_CATALOG_CURRENCIES": "${COLLECTOR_BACKEND_CATALOG_CURRENCIES:-}"
      },
      "secrets": [
        "domeggook_api_key",
        "kkulpick_backend_token"
      ],
      "volumes": [
        "${CONFIG_DIR:-/volume1/docker/kkulpick-collectors-v2/config}/domeggook.json:/run/config.json:ro",
        "${OPS_STATE_DIR:-/volume1/docker/kkulpick-collectors-v2/state/ops}/domeggook:/state/unified_ops/domeggook",
        "${DOMEGGOOK_STATE_DIR:-/volume1/docker/kkulpick-collectors-v2/state/domeggook}/domeggook_ops:/state/domeggook_ops",
        "${DOMEGGOOK_STATE_DIR:-/volume1/docker/kkulpick-collectors-v2/state/domeggook}/domeggook_open:/state/domeggook_open"
      ],
      "command": [
        "python",
        "-m",
        "services.collector.unified_live",
        "--provider",
        "domeggook",
        "--watch"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-m",
          "services.collector.unified_live",
          "--provider",
          "domeggook",
          "--health",
          "--state-dir",
          "/state"
        ],
        "interval": "30s",
        "timeout": "10s",
        "start_period": "40s",
        "retries": 3
      }
    },
