name: kkulpick-vismem
services:
  vision-redis:
    image: redis:7.4.7-alpine
    command: [redis-server, --save, "", --appendonly, "no", --maxmemory, 256mb, --maxmemory-policy, noeviction]
    healthcheck: {test: [CMD, redis-cli, ping], interval: 3s, retries: 20}
  vision-worker:
    image: kkulpick-vision-check:local
    env_file: vis.env
    environment: {REDIS_HOST: vision-redis}
    command: [celery, -A, app.celery_app.celery_app, worker, --loglevel=WARNING, --concurrency=1]
    volumes: [models:/home/app/.paddleocr]
    depends_on: {vision-redis: {condition: service_healthy}}
  vision-api:
    image: kkulpick-vision-check:local
    env_file: vis.env
    environment: {REDIS_HOST: vision-redis}
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, "8000"]
    depends_on: {vision-redis: {condition: service_healthy}}
volumes: {models: {}}
