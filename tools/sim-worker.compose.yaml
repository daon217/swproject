services:
  api:
    ports: !override []
  analysis-worker:
    build:
      context: ../..
      dockerfile: services/dev_runtime/Dockerfile
    command: [python, -m, services.dev_runtime.analysis_worker]
    environment:
      API_INTERNAL_URL: http://api:8000
      VISION_INTERNAL_URL: http://vision-down.invalid:8100
      RECOMMENDATION_INTERNAL_URL: http://recommendation:8000
      ANALYSIS_WORKER_TOKEN: ${ANALYSIS_WORKER_TOKEN}
      WORKSPACE_TOKEN: ${WORKSPACE_TOKEN}
      ANALYSIS_WORKER_CONCURRENCY: ${ANALYSIS_WORKER_CONCURRENCY}
    depends_on:
      api: {condition: service_healthy}
      recommendation: {condition: service_healthy}
